# Publishes the game to GitHub Pages on every push, so it can be played on any device.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

# Deploys from the repository's current default branch (the only branch the github-pages
# environment allows). If the default branch changes to main, change the branch below to match.
on:
  push:
    branches: ["claude/practical-meitner-7hs56r"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html style.css js icon.svg icon-180.png icon-512.png manifest.webmanifest _site/
          touch _site/.nojekyll
          # stamp this build's version on every asset so installed apps cannot keep stale files
          sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
